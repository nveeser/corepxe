variant: fcos
version: 1.5.0

storage:
    files: 
      - path: /etc/sudoers.d/myuser
        overwrite: true
        contents:
          inline: | 
            myuser ALL=(ALL) NOPASSWD: ALL

      - path: /etc/systemd/network/010-admin0.link
        overwrite: true
        contents:
          local: network/010-admin0.link